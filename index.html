const IC={

/* ---------- Encrypted store ---------- */
let S=null,KEY=null;
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const ITER=210000;
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){toast('Could not save on this device');return false;}}
async function deriveKey(pass,salt,iter){const base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function writeVault(key,salt,iter){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(S)));lsSet(VK,JSON.stringify({v:1,salt:b64(salt),iter,iv:b64(iv),ct:b64(ct)}));}
async function createVault(pass){const salt=crypto.getRandomValues(new Uint8Array(16));KEY=await deriveKey(pass,salt,ITER);U.salt=salt;await writeVault(KEY,salt,ITER);}
async function openVault(pass){const v=JSON.parse(lsGet(VK));const salt=unb64(v.salt);const key=await deriveKey(pass,salt,v.iter);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(v.iv)},key,unb64(v.ct));S=migrate(JSON.parse(dec.decode(pt)));KEY=key;U.salt=salt;}
let saveT=null;
async function saveNow(){clearTimeout(saveT);saveT=null;if(!KEY||!S)return;try{await writeVault(KEY,U.salt,ITER);}catch(e){}}
function save(){clearTimeout(saveT);saveT=setTimeout(saveNow,350);}
function freshState(o){return rtFix({v:1,profile:{height:o.h,start:iso(),stepBase:o.steps},weighIns:[{date:iso(),kg:o.kg,waist:o.waist||null}],sessions:[],active:null,steps:{},carry:{},bonus:{},good:{},days:{},rt:{}});}
function migrate(s){s.carry=s.carry||{};s.bonus=s.bonus||{};s.good=s.good||{};s.steps=s.steps||{};s.weighIns=s.weighIns||[];s.sessions=s.sessions||[];return rtFix(s);}
function rtFix(s){const r=s.rt=s.rt||{};const w=r.wake=r.wake||{};if(w.from==null)w.from=540;if(w.target==null)w.target=340;if(w.start===undefined)w.start=null;w.pauses=w.pauses||[];r.bottleMl=r.bottleMl||750;r.books=r.books||[];r.supps=r.supps||[{id:'mag',name:'Magnesium',dose:'',when:'night',stock:null}];r.ord=r.ord||{};r.dismissed=r.dismissed||{};r.nightEarly=r.nightEarly||0;if(r.socialStart==null)r.socialStart=0;if(r.socialEnd==null)r.socialEnd=480;if(r.barcode===undefined)r.barcode=null;s.days=s.days||{};return s;}

/* ---------- Program ---------- */
function progWeek(){const s=mondayOf(parseISO(S.profile.start));return Math.max(1,Math.round((mondayOf(new Date())-s)/(7*DAY))+1);}
function phase(){const w=progWeek();if(w<=2)return{k:'re',name:'Re-entry',tip:'Stop 2 to 3 reps short of failure while your joints and tendons catch up.'};if(w<=6)return{k:'build',name:'Build',tip:'Stop 1 to 2 reps short of failure on most sets.'};return{k:'grow',name:'Grow',tip:'Sets get added to exercises where you keep progressing.'};}
function plannedSets(it){const k=phase().k;let n=it.sets;if(k==='re')n=Math.min(n,2);if(k==='grow')n+=(S.bonus[it.ex]||0);return n;}
function nextType(){const l=S.sessions[S.sessions.length-1];return l?ROT[(ROT.indexOf(l.type)+1)%4]:'UA';}
function estMin(type){const n=PLAN[type].items.reduce((a,it)=>a+plannedSets(it),0);return Math.round(n*2.6+6);}
function lastItem(ex,before=S.sessions.length){for(let i=before-1;i>=0;i--){const it=S.sessions[i].items.find(x=>x.ex===ex&&x.logged.length);if(it)return it;}return null;}
function topW(it){return Math.max(...it.logged.map(s=>s.w));}
function allHitTop(it){const t=topW(it);const ws=it.logged.filter(s=>s.w===t);return it.logged.length>=it.planned&&ws.length>=Math.min(2,it.planned)&&ws.every(s=>s.r>=it.hi&&(s.e==='good'||s.e==='easy'));}
function suggestW(ex){const l=lastItem(ex);if(!l)return EX[ex].start;const t=topW(l);return allHitTop(l)?t+incOf(ex):t;}
function suggestR(ex,lo,hi,setIdx,w){const l=lastItem(ex);if(!l)return lo;if(w>topW(l))return lo;const s=l.logged[setIdx]||l.logged[l.logged.length-1];return clamp(s.r,lo,hi);}
function lastLine(ex){const l=lastItem(ex);if(!l)return'First time: pick a starting weight';const t=topW(l);return`Last time: ${t} lbs, ${l.logged.filter(s=>s.w===t).map(s=>s.r).join(', ')} reps`;}
function buildSession(type){const p=PLAN[type];const carry=S.carry[type]||[];const idx=p.items.map((_,i)=>i);idx.sort((a,b)=>(carry.includes(p.items[b].ex)?1:0)-(carry.includes(p.items[a].ex)?1:0));S.carry[type]=[];
return{id:'s'+Date.now(),type,start:Date.now(),week:progWeek(),phase:phase().k,restUntil:0,restFor:0,items:idx.map(i=>{const it=p.items[i];return{ex:it.ex,orig:it.ex,planned:plannedSets(it),lo:it.lo,hi:it.hi,ss:it.ss,perLeg:it.perLeg,logged:[],skipped:false,carried:carry.includes(it.ex)};})};}
function curIdx(a=S.active){return a.items.findIndex(it=>!it.skipped&&it.logged.length<it.planned);}
function ssPartner(a,i){const it=a.items[i];if(!it.ss)return null;const j=a.items.findIndex((x,k)=>k!==i&&x.ss===it.ss);return j<0?null:a.items[j];}
function sessionsThisWeek(){const m=mondayOf(new Date()).getTime();return S.sessions.filter(s=>s.start>=m);}
function trainedOn(d){const a=dayStart(d).getTime(),b=a+DAY;return S.sessions.some(s=>s.start>=a&&s.start<b);}
function restDay(){const t=new Date();if(trainedOn(t))return false;const y=new Date(t-DAY),y2=new Date(t-2*DAY);return trainedOn(y)&&trainedOn(y2);}
function warmups(ex,w){if(EX[ex].eq!=='b'||!EX[ex].cmp||w<=65)return null;const r=v=>Math.max(45,Math.round(v/5)*5);const out=[[45,10]];[[.5,8],[.7,4],[.85,2]].forEach(([p,n])=>{const v=r(w*p);if(v>out[out.length-1][0]&&v<w)out.push([v,n]);});return out;}
function plates(w){if(w<45)return'Below the 45 lb bar';if(w===45)return'Just the bar';let side=(w-45)/2;const ps=[];for(const p of [45,35,25,10,5,2.5]){while(side>=p-1e-9){ps.push(p);side-=p;}}return`45 lb bar + ${ps.join(' + ')} each side`;}
const e1rm=s=>s.w*(1+s.r/30);

/* ---------- Muscles ---------- */
function muscleCounts(sessions){const c={};const add=(m,k,v)=>{c[m]=c[m]||{p:0,s:0};c[m][k]+=v;};sessions.forEach(s=>s.items.forEach(it=>it.logged.forEach(()=>{EX[it.ex].p.forEach(m=>add(m,'p',1));EX[it.ex].s.forEach(m=>add(m,'s',.5));})));return c;}
function groupSets(sessions){const g={};GROUPS.forEach(([n,ms])=>{let t=0;sessions.forEach(s=>s.items.forEach(it=>it.logged.forEach(()=>{if(EX[it.ex].p.some(m=>ms.includes(m)))t+=1;else if(EX[it.ex].s.some(m=>ms.includes(m)))t+=.5;})));g[n]=t;});return g;}
function levelsFor(sessions,week){const c=muscleCounts(sessions);const L={};Object.keys(MUS).forEach(m=>{const x=c[m];if(!x)L[m]='n';else if(week)L[m]=(x.p+x.s)>=5?'p':'s';else L[m]=x.p>0?'p':'s';});return L;}

/* ---------- Steps and body ---------- */
function stepGoal(){const base=S.profile.stepBase||7000;if(base>=10000)return base;const n=Math.floor((Date.now()-parseISO(S.profile.start))/(14*DAY));return Math.min(10000,Math.round((base+1000*n)/500)*500);}
const stepsToday=()=>S.steps[iso()]||0;
const lastWeigh=()=>S.weighIns[S.weighIns.length-1]||null;
function weighDue(){const l=lastWeigh();return!l||(Date.now()-parseISO(l.date))>=6.5*DAY;}
function bmi(){const l=lastWeigh();if(!l)return null;const m=S.profile.height/100;return l.kg/(m*m);}
function bmiLabel(b){return b<18.5?'Below the healthy range':b<25?'Healthy range':b<30?'Above the healthy range':'Well above the healthy range';}
function lastWaist(){for(let i=S.weighIns.length-1;i>=0;i--)if(S.weighIns[i].waist)return S.weighIns[i];return null;}

/* ---------- Coach ---------- */
function coachLine(){if(S.active)return'Workout in progress. Pick up where you left off.';const goal=stepGoal(),st=stepsToday();
const now=new Date(),wm=wakeMin(now),rr=peekDay(iso()),hr=now.getHours();
if(wm!=null&&hr>=4&&hr<11&&!(rr&&rr.wake))return`Wake-up task first, then your brightest lights. Today's target is ${tfmt(wm)}.`;
if(wm!=null&&hr<10&&!trainedOn(now)&&!restDay()&&minOf(now)>wm+40)return'Running late? Start the workout and tap Options, Short on time. The 4 key lifts still count.';
if(trainedOn(new Date()))return st<goal?`Workout done. ${nf(goal-st)} steps to go today.`:'Workout done and steps hit. Solid day.';
if(restDay())return'Two training days in a row, so today is a rest day. A long walk counts.';
const t=nextType(),first=PLAN[t].items[0].ex,l=lastItem(first),w=suggestW(first);
if(l&&w>topW(l))return`${PLAN[t].name} is next. ${EX[first].name}: you earned ${w} lbs today.`;
return`${PLAN[t].name} is next, about ${estMin(t)} min. ${phase().k==='re'?'Ease in today.':''}`.trim();}
function summarize(sess,beforeIdx){const notes=[],prs=[];const done=sess.items.filter(it=>it.logged.length);
done.forEach(it=>{const nm=EX[it.ex].name;const best=Math.max(...it.logged.map(e1rm));let prev=0;for(let i=0;i<beforeIdx;i++)S.sessions[i].items.forEach(x=>{if(x.ex===it.ex)x.logged.forEach(s=>{prev=Math.max(prev,e1rm(s));});});
const bs=it.logged.reduce((a,s)=>e1rm(s)>e1rm(a)?s:a);
if(prev&&best>prev+.5){prs.push(nm);notes.push({p:1,t:'gym',i:'up',b:`New best on ${nm}.`,d:`${bs.w} lbs for ${bs.r}, your strongest yet.`});}
const fail=it.logged.some(s=>s.e==='failed'||s.r<it.lo);
if(fail){const t=topW(it);notes.push({p:2,t:'warn',i:'right',b:`${nm}: below ${it.lo} reps.`,d:`Keep ${t} lbs next time and build back up.`});}
else if(allHitTop(it))notes.push({p:4,t:'gym',i:'up',b:`${nm}: every set hit ${it.hi}.`,d:`Next time: ${topW(it)+incOf(it.ex)} lbs.`});
if(EX[it.ex].cmp)for(let k=1;k<it.logged.length;k++){const a=it.logged[k-1],b=it.logged[k];const rest=(b.t-a.t)/1000-40;if(rest<100&&b.w===a.w&&b.r<=a.r-2){notes.push({p:3,t:'gym',i:'clock',b:`${nm}: set ${k+1} dropped to ${b.r}.`,d:`You rested about ${mmss(Math.max(rest,20))}. Take 2 to 3 min on big lifts.`});break;}}});
const sk=sess.items.filter(it=>!it.logged.length&&!it.cut);if(sk.length)notes.push({p:5,t:'warn',i:'right',b:`Skipped ${sk.map(it=>EX[it.ex].name).join(', ')}.`,d:`${sk.length>1?'They go':'It goes'} first in your next ${PLAN[sess.type].name}.`});
const hard=sess.items.flatMap(it=>it.logged).filter(s=>s.e==='hard'||s.e==='failed').length,all=sess.items.flatMap(it=>it.logged).length;
if(sess.phase==='re'&&all&&hard/all>.3)notes.push({p:2,t:'warn',i:'clock',b:'Easing in matters.',d:'In weeks 1 and 2, stop 2 to 3 reps short of failure. Soreness now slows you down later.'});
notes.sort((a,b)=>a.p-b.p);return{notes:notes.slice(0,4),prs,done:done.length,total:sess.items.filter(it=>!it.cut).length};}
function finishWorkout(){const a=S.active;a.end=Date.now();a.restUntil=0;
const skipped=a.items.filter(it=>!it.logged.length&&!it.cut).map(it=>it.orig);if(skipped.length)S.carry[a.type]=skipped;
a.items.forEach(it=>{if(!it.logged.length)return;const good=it.logged.every(s=>s.e==='good'||s.e==='easy')&&it.logged.length>=it.planned;const fail=it.logged.some(s=>s.e==='failed');
S.good[it.ex]=good?(S.good[it.ex]||0)+1:0;if(a.phase==='grow'){if(fail)S.bonus[it.ex]=Math.max(0,(S.bonus[it.ex]||0)-1);else if(S.good[it.ex]>=2){S.bonus[it.ex]=Math.min(2,(S.bonus[it.ex]||0)+1);S.good[it.ex]=0;}}});
a.summary=summarize(a,S.sessions.length);S.sessions.push(a);S.active=null;saveNow();return a.id;}

/* ---------- Wheels ---------- */
function initWheels(root){root.querySelectorAll('.wheel').forEach(w=>{const idx=+w.dataset.idx;const items=w.querySelectorAll('.wi');const mark=i=>{items.forEach((el,k)=>{el.classList.toggle('on',k===i);el.setAttribute('aria-selected',k===i);});};
requestAnimationFrame(()=>{w.scrollTop=idx*44;});mark(idx);w.dataset.cur=idx;
w.addEventListener('scroll',()=>{const i=clamp(Math.round(w.scrollTop/44),0,items.length-1);if(i!==+w.dataset.cur){w.dataset.cur=i;mark(i);onWheel(w.dataset.wheel,i);}},{passive:true});
w.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const i=clamp(+w.dataset.cur+(e.key==='ArrowDown'?1:-1),0,items.length-1);w.scrollTo({top:i*44,behavior:'smooth'});}});});}
function wheelVals(name){if(U.mode==='onb'){return({h:range(140,210,1),kgI:range(40,180,1),kgD:range(0,9,1),waist:['Skip',...range(55,150,1)],steps:range(2000,15000,500)})[name];}
const sh=U.sheet;if(sh.wv&&sh.wv[name])return sh.wv[name];if(name==='w'||name==='n')return sh.vals;return({h:range(140,210,1),kgI:range(40,180,1),kgD:range(0,9,1),waist:['Skip',...range(55,150,1)]})[name];}
function onWheel(name,i){const v=wheelVals(name)[i];if(U.mode==='onb'){U.onb[name]=v;return;}const sh=U.sheet;if(!sh)return;sh[name]=v;
if(sh.k==='set'&&name==='w'){const el=$('[data-plate]');const e=EX[S.active.items[sh.i].ex];if(el&&e.eq==='b')el.textContent=plates(v);if(el&&e.eq==='w')el.textContent=v?'Added to your bodyweight':'Bodyweight only';}}
function scrollWheelTo(name,val){const w=$(`.wheel[data-wheel="${name}"]`);const i=wheelVals(name).indexOf(val);if(w&&i>=0)w.scrollTo({top:i*44,behavior:'smooth'});}

$('#app').innerHTML=view();const sc=$('#app .scroll');if(sc&&U.scroll[key]&&key===U.lastKey)sc.scrollTop=U.scroll[key];else if(sc&&U.scroll[key]&&U.keepScroll)sc.scrollTop=U.scroll[key];U.lastKey=key;U.keepScroll=false;initWheels($('#app'));}

/* ---------- Audio ---------- */
let AC=null;function audioReady(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function beep(){try{if(!AC)return;[0,.22].forEach(t=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.0001,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.25,AC.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+t+.18);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.2);});if(navigator.vibrate)navigator.vibrate([120,80,120]);}catch(e){}}

/* ---------- Actions ---------- */
async function onKey(k){if(k==='del'){U.entry=U.entry.slice(0,-1);}else if(U.entry.length<6)U.entry+=k;
const pad=$('#pad');if(pad){pad.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i<U.entry.length));}
if(U.entry.length<6)return;const code=U.entry;
if(U.mode==='lock'){const m=$('#lockmsg');if(m)m.textContent='Unlocking…';try{await openVault(code);U.mode='app';U.err='';U.entry='';afterUnlock();}catch(e){U.entry='';U.err='Wrong passcode. Try again.';render();const p=$('#pad');if(p)p.classList.add('shake');}return;}

/* ---------- Routines: data helpers ---------- */
const MIN=60000;
const tfmt=(m,ap)=>{m=((Math.round(m)%1440)+1440)%1440;const h=Math.floor(m/60);return`${h%12||12}:${pad2(m%60)}${ap?(h<12?' am':' pm'):''}`;};
const minOf=d=>d.getHours()*60+d.getMinutes();
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const RT=()=>S.rt;
const peekDay=k=>S.days[k]||null;
function dayRec(k=iso()){return S.days[k]||(S.days[k]={m:{},n:{},why:{},water:0,pages:0,supp:{}});}
const isEvening=()=>{const h=new Date().getHours();return h>=18||h<4;};
const DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

/* Wake-up plan: shift 15 min every 3 days, weekdays only */
function pausedBefore(date){let n=0;RT().wake.pauses.forEach(p=>{const a=parseISO(p.from),b=parseISO(p.to);const e=Math.min(date,b);if(e>a)n+=Math.round((e-a)/DAY);});return n;}
function wakeSteps(date){const w=RT().wake;if(!w.start)return 0;const raw=Math.round((dayStart(date)-parseISO(w.start))/DAY);const max=Math.ceil(Math.max(0,w.from-w.target)/15);return clamp(Math.floor((raw-pausedBefore(dayStart(date)))/3),0,max);}
function wakeMin(date){const w=RT().wake;if(!w.start)return null;const dw=date.getDay();if(dw===0||dw===6)return null;if(w.from<=w.target)return w.target;return Math.max(w.target,w.from-15*wakeSteps(date));}
function wakeInfo(){const w=RT().wake;if(!w.start)return null;const steps=Math.ceil(Math.max(0,w.from-w.target)/15);const total=Math.max(1,Math.ceil(steps*3/7));const t=dayStart(new Date());const raw=Math.round((t-parseISO(w.start))/DAY)-pausedBefore(t);const wk=Math.floor(Math.max(0,raw)/7)+1;return{total,wk:Math.min(wk,total),holding:wakeSteps(t)>=steps};}
function wakeLabel(){const i=wakeInfo();if(!i)return'Wake-up plan';const w=RT().wake;return i.holding?`Holding ${tfmt(w.target)}`:`Week ${i.wk} of ${i.total} toward ${tfmt(w.target)}`;}
function alarmNext(){const now=new Date();for(let k=0;k<3;k++){const d=addDays(now,k),m=wakeMin(d);if(m==null)continue;const at=new Date(d.getFullYear(),d.getMonth(),d.getDate(),Math.floor(m/60),m%60);if(at>now&&at-now<20*3600000)return{at,min:m};}return null;}
function nextWakeMin(){const now=new Date();for(let k=(now.getHours()<4?0:1);k<6;k++){const m=wakeMin(addDays(now,k));if(m!=null)return m;}return RT().wake.target;}
/* Bedtime = 7.5 h before the wake time, never later than 12:30 am */
function bedMin(tg){const rel=((tg-450)%1440+1440)%1440;let b=rel<720?rel+1440:rel;return Math.min(b,1470)%1440;}
function nightStart(){return((bedMin(nextWakeMin())-75-(RT().nightEarly||0))%1440+1440)%1440;}
function sleepCalc(){const al=alarmNext();let a=new Date(Date.now()+15*MIN);a=new Date(Math.ceil(a.getTime()/(5*MIN))*5*MIN);if(!al)return{al:null,asleep:a};return{al,asleep:a,mins:Math.max(0,Math.round((al.at-a)/MIN))};}
const wakeOnTime=(r,t)=>!!(r&&r.wake&&minOf(new Date(r.wake.at))<=t+10);

/* Steps of the morning and night routines */
const M_STEPS=[{id:'wake',t:'Wake-up task',d:'Brightest lights, then the task',auto:1},{id:'bed',t:'Make your bed'},{id:'snack',t:'Snack or coffee',d:'Coffee before the gym'}];
const N_STEPS=[{id:'bag',t:'Pack your gym bag'},{id:'lunch',t:'Make lunch'},{id:'clothes',t:'Lay out work clothes'},{id:'face',t:'Face wash routine'},{id:'teeth',t:'Brush teeth'},{id:'read',t:'Read',d:'Log the page you reach',read:1}];
function stepsOf(kind){let base=(kind==='m'?M_STEPS:N_STEPS).slice();const when=kind==='m'?'morning':'night';
const sp=RT().supps.filter(s=>s.when===when).map(s=>({id:'supp:'+s.id,t:`Take ${s.name.toLowerCase()}`,d:s.dose||'',supp:s.id}));
if(kind==='n'){const i=base.findIndex(x=>x.read);base.splice(i,0,...sp);}else base.push(...sp);
const ord=RT().ord[kind]||{};const mv=base.filter(x=>!x.auto&&!x.read);
if(mv.length&&mv.every(x=>ord[x.id]&&ord[x.id].n>=3)){mv.sort((a,b)=>ord[a.id].s/ord[a.id].n-ord[b.id].s/ord[b.id].n);let k=0;base=base.map(x=>(x.auto||x.read)?x:mv[k++]);}
return base;}
function stState(kind,st,k=iso()){const r=peekDay(k);if(!r)return null;if(st.supp&&r.supp[st.supp])return'd';return r[kind][st.id]||null;}
function setStep(kind,st,val,why){const r=dayRec();const had=stState(kind,st);
if(st.supp){const sp=RT().supps.find(s=>s.id===st.supp);if(val==='d'){if(!r.supp[st.supp]){r.supp[st.supp]=true;if(sp&&sp.stock!=null)sp.stock=Math.max(0,sp.stock-1);}delete r[kind][st.id];}else{if(r.supp[st.supp]){delete r.supp[st.supp];if(sp&&sp.stock!=null)sp.stock++;}if(val==='s')r[kind][st.id]='s';else delete r[kind][st.id];}}
else{if(val)r[kind][st.id]=val;else delete r[kind][st.id];}
if(val==='s'&&why)r.why[st.id]=why;else if(val!=='s')delete r.why[st.id];
if(val==='d'&&had!=='d'){const n=stepsOf(kind).filter(x=>x.id!==st.id&&stState(kind,x)==='d').length+1;const o=RT().ord[kind]=RT().ord[kind]||{};const e=o[st.id]=o[st.id]||{s:0,n:0};e.s+=n;e.n++;}
save();}
function rprog(kind,k=iso()){const sts=stepsOf(kind);let done=0,skip=0;sts.forEach(s=>{const v=stState(kind,s,k);if(v==='d')done++;else if(v==='s')skip++;});return{done,skip,total:sts.length,left:sts.length-done-skip};}
const nextStep=kind=>stepsOf(kind).find(s=>!stState(kind,s))||null;
const routTotals=()=>{const a=rprog('m'),b=rprog('n');return{done:a.done+b.done,total:a.total+b.total};};

/* Water */
const kgNow=()=>{const l=lastWeigh();return l?l.kg:75;};
function isGymDay(){const t=new Date(),dw=t.getDay();return trainedOn(t)||!!S.active||(dw>=1&&dw<=5&&!restDay()&&sessionsThisWeek().length<4);}
const waterTarget=()=>Math.round((kgNow()*30+(isGymDay()?500:0))/250)*250;
const bottleN=()=>Math.max(1,Math.ceil(waterTarget()/RT().bottleMl));
const waterDone=(k=iso())=>{const r=peekDay(k);return r?r.water:0;};

/* Reading */
const curBook=()=>[...RT().books].reverse().find(b=>!b.done)||null;
function bookRate(b){const cut=iso(addDays(new Date(),-13));const rec=(b.log||[]).filter(x=>x.d>=cut);if(rec.length<2)return null;const days=Math.max(1,Math.round((dayStart(new Date())-parseISO(rec[0].d))/DAY)+1);return rec.reduce((a,x)=>a+x.p,0)/days;}
const readOk=k=>{const r=peekDay(k);return!!(r&&(r.pages>0||r.n.read==='d'));};
const nightOk=k=>{const p=rprog('n',k);return p.total>0&&p.left===0&&p.done>=Math.ceil(p.total*.6);};
/* Forgiving streak: one isolated miss pauses it, two in a row reset it */
function streakOf(ok){const t=dayStart(new Date());const at=i=>iso(addDays(t,-i));let n=ok(at(0))?1:0,since=99,paused=false;
for(let i=1;i<400;i++){if(ok(at(i))){n++;since++;continue;}
const newer=i===1?true:ok(at(i-1)),older=ok(at(i+1));
if(newer&&older&&since>=7){if(i===1&&!ok(at(0)))paused=true;since=0;continue;}break;}
return{n,paused};}

/* Weekly review numbers */
function weekStats(mon){const today=dayStart(new Date());const ds=[0,1,2,3,4,5,6].map(i=>addDays(mon,i)).filter(d=>d<=today);
const sess=S.sessions.filter(s=>s.start>=mon.getTime()&&s.start<mon.getTime()+7*DAY);
const M={wake:{t:0,k:0},night:{t:0,k:0},read:{t:0,k:0},water:{t:0,k:0},steps:{t:0,k:0}};
const late=new Date().getHours()>=12;let pages=0;
ds.forEach(d=>{const k=iso(d),past=d<today,r=peekDay(k);const add=(m,ok,applies=true)=>{if(!applies)return;if(past||ok){M[m].t++;if(ok)M[m].k++;}};
const t=wakeMin(d);if(t!=null){const ok=wakeOnTime(r,t);if(past||ok||late){M.wake.t++;if(ok)M.wake.k++;}}
add('night',nightOk(k));add('read',readOk(k));
add('water',!!r&&r.water>=(r.wgoal||bottleN())&&r.water>0);add('steps',(S.steps[k]||0)>=stepGoal()&&(S.steps[k]||0)>0);if(r)pages+=r.pages||0;});
return{n:ds.length,workouts:sess.length,prNames:sess.flatMap(s=>s.summary?s.summary.prs:[]),M,pages};}
function reviewData(){const mon=mondayOf(new Date());const st=weekStats(mon);const c=[];
c.push({key:'gym',frac:st.workouts/4,t:`${st.workouts} of 4 workouts`,d:st.prNames.length?`New best: ${st.prNames[0]}${st.prNames.length>1?` and ${st.prNames.length-1} more`:''}`:'Every session counts',i:'gym',sec:'gym',has:true});
const wt=wakeMin(addDays(mon,4));const m=st.M;
if(m.wake.t)c.push({key:'wake',frac:m.wake.k/m.wake.t,t:`Up by ${tfmt(wt!=null?wt:RT().wake.target)} on ${m.wake.k} of ${m.wake.t} days`,d:m.wake.k/m.wake.t>=.8?'Right on the plan':'Close. The shift keeps going',i:'sun',sec:'rout',fix:1});
if(m.night.t)c.push({key:'night',frac:m.night.k/m.night.t,t:`Night routine ${m.night.k} of ${m.night.t} nights`,d:'Every step handled',i:'moon',sec:'rout',fix:1});
if(m.read.t)c.push({key:'read',frac:m.read.k/m.read.t,t:`Read ${m.read.k} of ${m.read.t} nights`,d:st.pages?`${st.pages} pages this week`:'Pages add up fast',i:'book',sec:'warn',fix:1});
if(m.water.t)c.push({key:'water',frac:m.water.k/m.water.t,t:`Water goal ${m.water.k} of ${m.water.t} days`,d:'Hydration made easy',i:'drop',sec:'today',fix:1});
if(m.steps.t)c.push({key:'steps',frac:m.steps.k/m.steps.t,t:`Steps goal ${m.steps.k} of ${m.steps.t} days`,d:`Goal is ${nf(stepGoal())}`,i:'walk',sec:'today'});
const wins=c.filter(x=>x.frac>=.6).sort((a,b)=>b.frac-a.frac).slice(0,3);
const fixes=c.filter(x=>x.fix&&x.frac<.7).sort((a,b)=>a.frac-b.frac);
return{mon,st,wins,fix:fixes[0]||null,any:c.some(x=>x.frac>0)};}
const FIXTXT={wake:'Hold the wake target steady for a week?',night:'Start the night routine 15 min earlier?',read:'Move the social media block to 9:30 pm?',water:'Try a different bottle size?'};
function todayWins(){const w=[];const dd=peekDay(iso());const d=new Date();
if(trainedOn(d)){const s=S.sessions[S.sessions.length-1];const n=s.summary?s.summary.prs.length:0;w.push({sec:'gym',t:`${PLAN[s.type].name} done${n?`, ${plural(n,'PR')}`:''}`});}
if(dd&&dd.wake){const t=wakeMin(d);w.push({sec:'rout',t:`Up at ${tfmt(minOf(new Date(dd.wake.at)),true)}${t!=null&&wakeOnTime(dd,t)?', on target':''}`});}
if(rprog('m').left===0&&rprog('m').done>0)w.push({sec:'rout',t:'Morning routine done'});
if(waterDone()>=bottleN())w.push({sec:'today',t:`Water goal hit, ${bottleN()} bottles`});
if(stepsToday()>=stepGoal())w.push({sec:'today',t:`${nf(stepsToday())} steps`});
if(dd&&dd.pages>0)w.push({sec:'warn',t:`Read ${plural(dd.pages,'page')}`});
return w.slice(0,4);}

const kick=(t)=>`<div class="kicker up">${esc(t)}</div>`;

function rings(p1,p2,p3,label){const C=r=>2*Math.PI*r;const ring=(r,p,g,bg)=>`<circle cx="59" cy="59" r="${r}" fill="none" stroke="${bg}" stroke-width="13"/><circle cx="59" cy="59" r="${r}" fill="none" stroke="url(#${g})" stroke-width="13" stroke-linecap="round" stroke-dasharray="${Math.max(.1,clamp(p,0,1)*C(r))} ${C(r)}" transform="rotate(-90 59 59)"/>`;
return`<svg width="118" height="118" viewBox="0 0 118 118" role="img" aria-label="${esc(label)}"><defs><linearGradient id="rgR" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A78BFF"/><stop offset="1" stop-color="#6A4DFF"/></linearGradient><linearGradient id="rgS" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5AC8FA"/><stop offset="1" stop-color="#0A84FF"/></linearGradient><linearGradient id="rgG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF7A5C"/><stop offset="1" stop-color="#FF2D55"/></linearGradient></defs>${ring(50,p1,'rgR','rgba(106,77,255,.16)')}${ring(36,p2,'rgS','rgba(10,132,255,.16)')}${ring(22,p3,'rgG','rgba(255,45,85,.14)')}</svg>`;}
function wakeDue(){const d=new Date(),h=d.getHours(),wm=wakeMin(d),r=peekDay(iso());return wm!=null&&h>=4&&h<12&&!(r&&(r.wake||r.m.wake==='s'))&&RT().wakeLater!==iso();}
function vToday(){const d=new Date();if(isEvening())return vTodayNight();
const t=nextType(),sg=stepGoal(),st=stepsToday(),due=weighDue();const wm=wakeMin(d),dd=peekDay(iso()),gt=wm!=null?wm+25:null;const items=[];
const R=(min,html)=>items.push({min:min==null?9999:min,html});
if(wm!=null&&!(dd&&(dd.wake||dd.m.wake==='s'))&&d.getHours()<12)R(wm,`<button class="row" data-a="wakeStart">${tile('rout','sun')}<div class="grow"><div class="t1">Wake-up task</div><div class="t2">Brightest lights, then the task</div></div><div class="num t1">${tfmt(wm)}</div></button>`);
const tm=gt!=null?`<div class="num t1">${tfmt(gt)}</div>`:ic('chev',18);
const gymPending=!S.active&&!trainedOn(d)&&!restDay();
if(S.active)R(gt,`<button class="row" data-a="openWorkout">${tile('gym','gym')}<div class="grow"><div class="t1">Resume ${PLAN[S.active.type].name}</div><div class="t2">Started ${dur(Date.now()-S.active.start)} ago</div></div>${ic('chev',18)}</button>`);
else if(trainedOn(d))R(gt,`<div class="row">${tile('gym','check')}<div class="grow"><div class="t1">Workout done</div><div class="t2">${PLAN[S.sessions[S.sessions.length-1].type].name}</div></div></div>`);
else if(restDay())R(gt,`<div class="row">${tile('gym','moon')}<div class="grow"><div class="t1">Rest day</div><div class="t2">${PLAN[t].name} tomorrow</div></div></div>`);
else R(gt,`<button class="row" data-a="goGym">${tile('gym','gym')}<div class="grow"><div class="t1">Gym: ${PLAN[t].name}</div><div class="t2">About ${estMin(t)} min</div></div>${tm}</button>`);
const se=RT().socialEnd;if(RT().wake.start&&minOf(d)<se)R(se,`<div class="row">${tile('rout','lock')}<div class="grow"><div class="t1">Social media unlocks</div><div class="t2">${gymPending?'After the gym':'Your block ends'}</div></div><div class="num t1">${tfmt(se)}</div></div>`);
const np=rprog('n');if(np.left>0){let ns=nightStart();if(ns<720)ns+=1440;R(ns,`<button class="row" data-a="openRoutine" data-k="n">${tile('rout','moon')}<div class="grow"><div class="t1">Night routine</div><div class="t2">${np.left} steps</div></div><div class="num t1">${tfmt(nightStart())}</div></button>`);}
if(!RT().wake.start)R(null,`<button class="row" data-a="push" data-v="wakeplan">${tile('rout','sun')}<div class="grow"><div class="t1">Set your wake-up plan</div><div class="t2">Gets you to ${tfmt(RT().wake.target)}, 15 min every 3 days</div></div>${ic('chev',18)}</button>`);
if(d.getDay()===0)R(null,`<button class="row" data-a="push" data-v="review">${tile('rout','list')}<div class="grow"><div class="t1">Your week is ready</div><div class="t2">3 wins and one fix</div></div>${ic('chev',18)}</button>`);
if(st<sg)R(null,`<button class="row" data-a="stepsOpen">${tile('today','walk')}<div class="grow"><div class="t1">${nf(sg-st)} steps to go</div><div class="t2">A 10 min walk is about 1,000</div></div>${ic('chev',18)}</button>`);
if(due)R(null,`<button class="row" data-a="weighOpen">${tile('gym','scale')}<div class="grow"><div class="t1">Weekly weigh-in</div><div class="t2">After waking, before eating</div></div>${ic('chev',18)}</button>`);
RT().supps.filter(s=>s.stock!=null&&s.stock<=7).forEach(s=>R(null,`<button class="row" data-a="suppOpen" data-id="${s.id}">${tile('warn','pill')}<div class="grow"><div class="t1">Reorder ${esc(s.name.toLowerCase())}</div><div class="t2">${s.stock} left</div></div>${ic('chev',18)}</button>`));
items.sort((a,b)=>a.min-b.min);
const rp=routTotals(),wd=waterDone(),bn=bottleN(),wk=sessionsThisWeek().length;
const gstat=S.active?'In progress':trainedOn(d)?'Done':restDay()?'Rest day':'Up next';
return`<div class="scroll"><div class="stack">${head(fmtLong(d),'Today',`<button class="iconbtn card" data-a="push" data-v="settings" aria-label="Settings">${ic('gear',21,2)}</button>`)}
<div class="card pad flex gap12">${tile('today','spark')}<div class="t3">${esc(coachLine())}</div></div>
<button class="card padl flex" data-a="goRout" style="gap:22px;text-align:left;width:100%">${rings(rp.total?rp.done/rp.total:0,wd/bn,wk/4,`Routines ${rp.done} of ${rp.total}. Water ${wd} of ${bn} bottles. Workouts ${wk} of 4 this week`)}<div class="col gap8"><div><div class="t2 b">Routines</div><div class="num" style="font-size:24px;color:var(--purple)">${rp.done}/${rp.total}</div></div><div><div class="t2 b">Water</div><div class="num" style="font-size:24px;color:var(--blue)">${wd}/${bn}<span class="t2" style="font-weight:700;font-size:16px"> bottles</span></div></div><div><div class="t2 b">Gym</div><div class="num" style="font-size:24px;color:var(--coral)">${gstat}</div></div></div></button>
${lbl('Up next')}<div class="card col">${items.length?items.map(x=>x.html).join(''):'<div class="empty t3">Nothing left today. Nice.</div>'}</div></div></div>`;}
function vTodayNight(){const d=new Date(),sl=sleepCalc(),p=rprog('n'),nx=nextStep('n'),idx=nx?stepsOf('n').findIndex(s=>s.id===nx.id)+1:0,wins=todayWins();let card;
if(sl.al){const h=Math.floor(sl.mins/60),m=sl.mins%60;card=`<div class="card padl col gap8"><div class="flex gap12">${tile('today','moon')}<div class="t1">If you're asleep by ${tfmt(minOf(sl.asleep),true)}</div></div><div class="num" style="font-size:58px;line-height:1.05">${h}h ${m}m</div><div class="t2" style="font-size:16px">of sleep before your ${tfmt(sl.al.min,true)} alarm</div>${sl.mins<420?'<div class="t2 warn b">Under 7 hours. Every 15 min you wait now comes out of your sleep.</div>':''}</div>`;}
else if(RT().wake.start){card=`<div class="card padl col gap8"><div class="flex gap12">${tile('today','moon')}<div class="t1">No alarm tomorrow</div></div><div class="num" style="font-size:58px;line-height:1.05">${tfmt(bedMin(nextWakeMin()))}</div><div class="t2" style="font-size:16px">is a good time to be asleep. Stay within an hour of your weekday wake time.</div></div>`;}
else card=`<button class="card padl flex gap12" data-a="push" data-v="wakeplan" style="width:100%;text-align:left">${tile('today','moon')}<div class="grow"><div class="t1">Set your wake-up plan</div><div class="t2">Then this card shows how much sleep you get tonight.</div></div>${ic('chev',18)}</button>`;
const nc=p.left===0?`<div class="card pad flex gap12">${tile('rout','check','lg')}<div class="grow"><div class="kicker up">Night routine</div><div class="t1" style="font-size:19px">Done. Lights out.</div></div></div>`:`<div class="card pad flex gap12">${tile('rout','moon','lg')}<div class="grow"><div class="kicker up">Night routine · ${idx} of ${p.total}</div><div class="t1" style="font-size:19px;margin-top:2px">Next: ${esc(nx.t.toLowerCase())}</div></div><button class="btn sm solid" data-a="openRoutine" data-k="n">${p.done+p.skip?'Continue':'Start'}</button></div>`;
return`<div class="scroll"><div class="stack">${head(`${DOW[d.getDay()]} ${d.getHours()<4?'night':'evening'}`,'Today',`<button class="iconbtn card" data-a="push" data-v="settings" aria-label="Settings">${ic('gear',21,2)}</button>`).replace('class="kicker"','class="kicker up"')}
${card}${nc}${lbl("Today's wins")}<div class="card col">${wins.length?wins.map(w=>`<div class="row">${tile(w.sec,'check','sm round')}<div class="t1">${esc(w.t)}</div></div>`).join(''):'<div class="empty t3">Nothing logged yet. A short walk still counts.</div>'}</div></div></div>`;}

/* Sheets for the routines section */
function sheetHTML2(sh){let b='';
if(sh.k==='bottle')b=`<h2>Bottle size</h2><div class="t2" style="margin-top:-10px">The one you actually carry.</div>${wheel('n',sh.vals,sh.n,'ml',v=>nf(v))}<button class="btn" data-a="bottleSave">Save</button>`;
if(sh.k==='time')b=`<h2>${sh.n==='from'?'When do you get up now?':'Your goal wake time'}</h2><div class="t2" style="margin-top:-10px">${sh.n==='from'?'The plan starts here and moves 15 min earlier every 3 days. Saving restarts it.':'The plan stops moving once it gets here.'}</div><div class="wheels">${wheel('th',sh.wv.th,sh.th,'h',v=>String(v))}${wheel('tm',sh.wv.tm,sh.tm,'min',v=>pad2(v))}</div><button class="btn" data-a="timeSave">Save</button>`;
if(sh.k==='page'){const bk=curBook();b=`<h2>${esc(bk.title)}</h2><div class="t2" style="margin-top:-10px">Last page: ${bk.page} of ${bk.total}. Which page are you on now?</div><div class="num center" style="font-size:46px;min-height:56px" data-npval>${esc(U.np.val)||'&nbsp;'}</div>${npadHTML(false)}<button class="btn" data-a="pageSave">Save</button>`;}
if(sh.k==='book')b=`<h2>Add a book</h2><input class="txt" id="bk-title" placeholder="Title" autocomplete="off" maxlength="80"><input class="txt" id="bk-total" inputmode="numeric" pattern="[0-9]*" placeholder="Total pages" maxlength="4"><div class="flex gap12"><div id="bk-prev">${coverBox({cover:sh.cover},44,62)}</div><label class="btn sm soft" style="cursor:pointer;position:relative">Add a cover photo<input class="hidden" type="file" id="bk-cover" accept="image/*"></label></div><button class="btn" data-a="bookSave">Save</button>`;
if(sh.k==='supp'){const s=sh.s;b=`<h2>${s.id?'Edit':'Add'} supplement</h2><input class="txt" id="sp-name" placeholder="Name" value="${esc(s.name||'')}" maxlength="40"><input class="txt" id="sp-dose" placeholder="Dose, for example 5 g" value="${esc(s.dose||'')}" maxlength="30"><div class="seg" style="grid-template-columns:repeat(3,minmax(0,1fr))">${Object.entries(WHEN).map(([k,n])=>`<button class="${s.when===k?'on':''}" data-a="suppWhen" data-w="${k}">${n}</button>`).join('')}</div><input class="txt" id="sp-stock" inputmode="numeric" placeholder="How many left? Optional, for refill alerts" value="${s.stock!=null?s.stock:''}"><button class="btn" data-a="suppSave">Save</button>${s.id?'<button class="link" style="align-self:center;color:var(--amber)" data-a="suppDel">Remove</button>':''}`;}
if(sh.k==='skip'){const stp=stepsOf(sh.kind).find(x=>x.id===sh.id);b=`<h2>Skip ${esc(stp?stp.t.toLowerCase():'this')}?</h2><div class="t2" style="margin-top:-10px">One tap. It helps me learn what to drop or move.</div><div class="card col">${['Too tired','No time','Not needed today','Forgot'].map(w=>`<button class="row" data-a="skipWhy" data-w="${w}"><div class="grow t1">${w}</div></button>`).join('')}</div>`;}
return b;}

Object.assign(A,{
goRout:()=>{U.tab='rout';U.stack=[];render();},
openRoutine:d=>{U.stack.push({v:'routine',id:d.k});render();const sc=$('#app .scroll');if(sc)sc.scrollTop=0;},
stepTap:d=>{const st=stepsOf(d.k).find(s=>s.id===d.id);if(!st)return;const v=stState(d.k,st);
if(v)setStep(d.k,st,null);else if(st.auto){A.wakeStart();return;}else if(st.read&&curBook()){A.pageOpen();return;}else setStep(d.k,st,'d');
U.keepScroll=true;render();postStep(d.k);},
stepSet:d=>{const st=stepsOf(d.k).find(s=>s.id===d.id);if(!st)return;setStep(d.k,st,d.v);U.keepScroll=true;render();postStep(d.k);},
skipWhy:d=>{const sh=U.sheet;const st=stepsOf(sh.kind).find(s=>s.id===sh.id);if(st)setStep(sh.kind,st,'s',d.w);closeSheet();U.keepScroll=true;render();},
waterAdd:()=>{const r=dayRec();r.water++;r.wgoal=bottleN();save();U.keepScroll=true;render();toast(`${r.water} of ${bottleN()} bottles`);},
waterUndo:()=>{const r=dayRec();r.water=Math.max(0,r.water-1);save();U.keepScroll=true;render();},
bottleOpen:()=>{const vals=range(250,2000,50);const c=RT().bottleMl;openSheet({k:'bottle',vals,n:vals.includes(c)?c:750});},
bottleSave:()=>{RT().bottleMl=U.sheet.n;save();closeSheet();U.keepScroll=true;render();},
nk:d=>{const n=U.np;let v=n.val;if(d.k==='del')v=v.slice(0,-1);else if(d.k==='.'){if(v&&!v.includes('.'))v+='.';}else if(v.length<n.max)v+=d.k;n.val=v;const el=$('[data-npval]');if(el)el.innerHTML=esc(n.fmt(v))||'&nbsp;';if(U.mode==='app'&&!U.sheet&&curView().v==='wake'&&U.wk&&U.wk.i===0&&U.wk.kind==='math')mathCheck();},
pageOpen:()=>{if(!curBook())return A.bookOpen();U.np={val:'',max:4,fmt:v=>v};openSheet({k:'page'});},
pageSave:()=>{const b=curBook(),v=+U.np.val;if(!v||v<=b.page){toast(`Enter a page after ${b.page}`);return;}if(v>b.total){toast(`This book has ${b.total} pages`);return;}
const delta=v-b.page,k=iso();dayRec().pages+=delta;b.log=b.log||[];const last=b.log[b.log.length-1];if(last&&last.d===k)last.p+=delta;else b.log.push({d:k,p:delta});b.page=v;if(v>=b.total)b.done=true;
setStep('n',N_STEPS.find(x=>x.read),'d');save();closeSheet();U.keepScroll=true;render();toast(b.done?'Finished the book. Well done.':`+${plural(delta,'page')}`);postStep('n');},
bookOpen:()=>openSheet({k:'book',cover:null}),
bookSave:()=>{const title=($('#bk-title').value||'').trim(),total=parseInt($('#bk-total').value,10);if(!title||!(total>0)){toast('Add a title and the total pages');return;}
RT().books.push({id:'b'+Date.now(),title,total,page:0,cover:U.sheet.cover||null,start:iso(),log:[],done:false});save();closeSheet();U.keepScroll=true;render();},
suppTake:d=>{const s=RT().supps.find(x=>x.id===d.id);if(!s)return;const when=s.when==='night'?'n':'m';const st=stepsOf(when).find(x=>x.supp===s.id)||{id:'supp:'+s.id,supp:s.id};setStep(when,st,stState(when,st)==='d'?null:'d');U.keepScroll=true;render();},
suppOpen:d=>{const s=RT().supps.find(x=>x.id===d.id);openSheet({k:'supp',s:s?{...s}:{id:'',name:'',dose:'',when:'morning',stock:null}});},
suppWhen:d=>{U.sheet.s.when=d.w;document.querySelectorAll('[data-a="suppWhen"]').forEach(b=>b.classList.toggle('on',b.dataset.w===d.w));},
suppSave:()=>{const sh=U.sheet,name=($('#sp-name').value||'').trim();if(!name){toast('Add a name');return;}const stock=parseInt($('#sp-stock').value,10);const rec={id:sh.s.id||('s'+Date.now()),name,dose:($('#sp-dose').value||'').trim(),when:sh.s.when,stock:stock>=0?stock:null};
const i=RT().supps.findIndex(x=>x.id===rec.id);if(i>=0)RT().supps[i]=rec;else RT().supps.push(rec);save();closeSheet();U.keepScroll=true;render();},
suppDel:()=>{RT().supps=RT().supps.filter(x=>x.id!==U.sheet.s.id);save();closeSheet();U.keepScroll=true;render();},
suppAdd:d=>{const P={creatine:['Creatine monohydrate','5 g'],vitd:['Vitamin D',''],protein:['Protein powder','']}[d.id];RT().supps.push({id:'s'+Date.now(),name:P[0],dose:P[1],when:'morning',stock:null});save();U.keepScroll=true;render();},
timeOpen:d=>{const w=RT().wake,v=d.n==='from'?w.from:w.target;openSheet({k:'time',n:d.n,th:Math.floor(v/60),tm:Math.round(v%60/5)*5%60,wv:{th:range(0,23,1),tm:range(0,55,5)}});},
timeSave:()=>{const sh=U.sheet,m=sh.th*60+sh.tm,w=RT().wake;if(sh.n==='from'){w.from=m;w.start=iso();w.pauses=[];}else w.target=m;save();closeSheet();U.keepScroll=true;render();toast(sh.n==='from'?'Plan started':'Goal saved');},
copyUrl:()=>{const u=location.origin+location.pathname+'#wake';try{navigator.clipboard.writeText(u).then(()=>toast('Link copied'),()=>toast('Press and hold the link to copy'));}catch(e){toast('Press and hold the link to copy');}},
rereg:()=>{RT().barcode=null;save();toast('Next barcode day, scan a new one');render();},
reviewFix:d=>{const k=d.key,mon=iso(mondayOf(new Date()));RT().dismissed[mon]=true;
if(k==='read'){RT().socialStart=1290;toast('Saved. Change the Screen Time block to 9:30 pm too.');}
else if(k==='wake'){RT().wake.pauses.push({from:iso(),to:iso(addDays(new Date(),7))});toast('Wake target held for 7 days');}
else if(k==='night'){RT().nightEarly=Math.min(45,(RT().nightEarly||0)+15);toast('Night routine now starts 15 min earlier');}
else if(k==='water'){save();U.keepScroll=true;render();A.bottleOpen();return;}
save();U.keepScroll=true;render();},
reviewSkip:()=>{RT().dismissed[iso(mondayOf(new Date()))]=true;save();U.keepScroll=true;render();},
wakeStart:()=>{const r=dayRec();U.np={val:'',max:3,fmt:v=>v};U.wk={i:r.wake?(r.light?2:1):0,kind:wakeKind(),q:mkMath(),qi:0,msg:''};U.tab='rout';U.stack=[{v:'wake'}];render();},
camOpen:()=>{const w=U.wk;w.msg='';if(w.kind==='barcode')camStart();else{const f=$('#wkfile');if(f)f.click();}},
lightOn:()=>{const r=dayRec();r.light=true;save();U.wk.i=2;render();},
wakeEnd:()=>{camStop();U.wk=null;U.stack=[];U.tab='today';render();},
wakeLater:()=>{camStop();RT().wakeLater=iso();save();U.wk=null;U.stack=[];U.tab='today';render();}
});
function postStep(kind){if(kind==='n'&&rprog('n').left===0)toast(`Night routine done. Lights out by ${tfmt(bedMin(nextWakeMin()))}`);}
function mathCheck(){const w=U.wk,ans=String(w.q[w.qi][1]),v=U.np.val;if(v===ans){w.qi++;U.np.val='';if(w.qi>=3)wakeTaskDone();else render();}else if(v.length>=ans.length){U.np.val='';const el=$('[data-npval]');if(el){el.textContent='Try again';el.classList.add('shake');setTimeout(()=>{el.classList.remove('shake');el.innerHTML='&nbsp;';},550);}}}
/* swipe on routine rows: right finishes, left skips */
let swp=null;
document.addEventListener('pointerdown',e=>{const el=e.target.closest('.srow');swp=el?{el,x:e.clientX,y:e.clientY}:null;});
document.addEventListener('pointerup',e=>{if(!swp)return;const dx=e.clientX-swp.x,dy=e.clientY-swp.y,el=swp.el;swp=null;if(Math.abs(dx)>70&&Math.abs(dy)<40){U.noClick=Date.now();if(dx>0)A.stepSet({k:el.dataset.k,id:el.dataset.id,v:'d'});else openSheet({k:'skip',kind:el.dataset.k,id:el.dataset.id});}});
document.addEventListener('pointercancel',()=>{swp=null;});
document.addEventListener('change',e=>{if(e.target.id==='wkfile'&&e.target.files[0])wakeTaskDone();
if(e.target.id==='bk-cover'&&e.target.files[0]){const f=e.target.files[0];const img=new Image(),u=URL.createObjectURL(f);img.onload=()=>{const w=160,h=Math.round(img.height*w/img.width),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);if(U.sheet&&U.sheet.k==='book'){U.sheet.cover=c.toDataURL('image/jpeg',.7);const p=$('#bk-prev');if(p)p.innerHTML=coverBox({cover:U.sheet.cover},44,62);}};img.onerror=()=>toast('Could not read that photo');img.src=u;}});
window.addEventListener('hashchange',()=>{if(U.mode==='app'&&S&&/#wake/.test(location.hash)){try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}A.wakeStart();}});
